<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Journal Entry</title>
<style>
  body { font-family: Arial, sans-serif; font-size: 14px; max-width: 480px; margin: 30px auto; padding: 0 16px; }
  h2 { margin-bottom: 4px; }
  label { display: block; margin-top: 14px; font-weight: bold; }
  input, select, textarea {
    width: 100%; padding: 7px; margin-top: 4px; box-sizing: border-box;
    font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .hint { color: #666; font-size: 11px; margin-top: 3px; }
  .readonly { background: #f3f3f3; }
  button {
    margin-top: 20px; padding: 9px 18px; font-size: 14px; border: none;
    border-radius: 4px; background: #1a73e8; color: white; cursor: pointer;
  }
  button:disabled { background: #999; cursor: default; }
  #error { color: #c00; margin-top: 10px; white-space: pre-wrap; }
  #success { color: #0a7a2f; margin-top: 10px; }
  #loading { color: #666; margin-top: 10px; }
</style>
</head>
<body>

<h2>New Journal Entry</h2>
<div id="loading">Loading…</div>

<form id="form" style="display:none">
  <div class="row">
    <div>
      <label>Financial Year</label>
      <input id="finYear" class="readonly" readonly>
      <div class="hint" id="fyHint"></div>
    </div>
    <div>
      <label>Journal No.</label>
      <input id="jrnlNo" class="readonly" readonly>
    </div>
  </div>

  <label>Date</label>
  <input type="date" id="date">

  <div class="row">
    <div>
      <label>Debit Account</label>
      <select id="drAccount"><option value="">Select…</option></select>
    </div>
    <div>
      <label>Credit Account</label>
      <select id="crAccount"><option value="">Select…</option></select>
    </div>
  </div>

  <label>Details of Transaction</label>
  <textarea id="details" rows="2"></textarea>

  <label>Amount</label>
  <input type="number" id="amount" min="0" step="0.01">

  <button type="button" id="submitBtn" onclick="submitEntry()">Add Journal Entry</button>
</form>

<div id="error"></div>
<div id="success"></div>

<script>
  // ---- Configure this ----
  const WEB_APP_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
  // -------------------------

  function loadForm() {
    fetch(WEB_APP_URL + '?action=journalForm')
      .then(r => r.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error);
        init(res.data);
      })
      .catch(showError);
  }

  function init(data) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('form').style.display = 'block';

    document.getElementById('finYear').value = data.finYear;
    document.getElementById('fyHint').innerText = data.finYearStart + ' to ' + data.finYearEnd;
    document.getElementById('jrnlNo').value = data.nextJrnlNo;
    document.getElementById('date').min = data.finYearStart;
    document.getElementById('date').max = data.finYearEnd;

    const dr = document.getElementById('drAccount');
    const cr = document.getElementById('crAccount');
    dr.innerHTML = '<option value="">Select…</option>';
    cr.innerHTML = '<option value="">Select…</option>';
    data.accounts.forEach(a => {
      dr.innerHTML += '<option value="' + a + '">' + a + '</option>';
      cr.innerHTML += '<option value="' + a + '">' + a + '</option>';
    });
  }

  function showError(err) {
    document.getElementById('error').innerText = err.message || err;
    document.getElementById('submitBtn').disabled = false;
  }

  function submitEntry() {
    document.getElementById('error').innerText = '';
    document.getElementById('success').innerText = '';
    document.getElementById('submitBtn').disabled = true;

    const entry = {
      date: document.getElementById('date').value,
      finYear: document.getElementById('finYear').value,
      drAccount: document.getElementById('drAccount').value,
      crAccount: document.getElementById('crAccount').value,
      details: document.getElementById('details').value,
      amount: document.getElementById('amount').value
    };

    if (!entry.date) { showError('Please select a date'); return; }

    // text/plain avoids a CORS preflight; the server parses it as JSON.
    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'journal', entry: entry })
    })
      .then(r => r.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error);
        document.getElementById('success').innerText = 'Saved as Journal No. ' + res.data.jrnlNo;
        document.getElementById('details').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('submitBtn').disabled = false;
        loadForm(); // refresh next jrnlNo / account list
      })
      .catch(err => {
        showError(err);
        document.getElementById('submitBtn').disabled = false;
      });
  }

  loadForm();
</script>
</body>
</html>
