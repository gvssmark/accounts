<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ledger</title>
<style>
  body { font-family: Arial, sans-serif; font-size: 14px; max-width: 900px; margin: 30px auto; padding: 0 16px; }
  h2 { margin-bottom: 4px; }
  .controls { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
  .controls > div { flex: 1; min-width: 180px; }
  label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 12px; color: #444; }
  select { width: 100%; padding: 7px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
  .account-block { margin-bottom: 28px; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; }
  .account-header {
    background: #f5f5f5; padding: 8px 12px; font-weight: bold;
    display: flex; justify-content: space-between; border-bottom: 1px solid #e0e0e0;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 10px; text-align: right; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
  th:nth-child(1), td:nth-child(1) { text-align: left; }
  th:nth-child(2), td:nth-child(2) { text-align: left; }
  th:nth-child(3), td:nth-child(3) { text-align: left; }
  th { background: #fafafa; font-size: 11px; text-transform: uppercase; color: #666; }
  .closing { font-weight: bold; background: #fbfbfb; }
  .empty { color: #888; padding: 12px; font-style: italic; }
  #error { color: #c00; margin-top: 10px; white-space: pre-wrap; }
  #loading { color: #666; }
</style>
</head>
<body>

<h2>Ledger</h2>

<div class="controls">
  <div>
    <label>Financial Year</label>
    <select id="finYear" onchange="load()"><option value="">Loading…</option></select>
  </div>
  <div>
    <label>Account</label>
    <select id="account" onchange="load()"><option value="ALL">All Accounts</option></select>
  </div>
</div>

<div id="loading">Loading…</div>
<div id="results"></div>
<div id="error"></div>

<script>
  // ---- Configure this ----
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyR1RBasM75-8QsHp5DJ-kApzpo4-LueQmYK5HbtShnOtrDBpSMTbc4MrUMbQngm-D70w/exec';
  // -------------------------

  function fmt(n) {
    return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function init() {
    Promise.all([
      fetch(WEB_APP_URL + '?action=finYears').then(r => r.json()),
      fetch(WEB_APP_URL + '?action=journalForm').then(r => r.json()) // reuse for accounts list
    ]).then(([fyRes, jfRes]) => {
      if (!fyRes.ok) throw new Error(fyRes.error);
      if (!jfRes.ok) throw new Error(jfRes.error);

      const fySel = document.getElementById('finYear');
      fySel.innerHTML = '';
      fyRes.data.finYears.forEach(fy => {
        fySel.innerHTML += '<option value="' + fy + '">' + fy + '</option>';
      });
      fySel.value = fyRes.data.finYears[fyRes.data.finYears.length - 1] || '';

      const accSel = document.getElementById('account');
      jfRes.data.accounts.forEach(a => {
        accSel.innerHTML += '<option value="' + a + '">' + a + '</option>';
      });

      load();
    }).catch(showError);
  }

  function load() {
    const finYear = document.getElementById('finYear').value;
    const acno = document.getElementById('account').value;
    if (!finYear) return;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').innerText = '';

    fetch(WEB_APP_URL + '?action=ledger&finYear=' + encodeURIComponent(finYear) + '&acno=' + encodeURIComponent(acno))
      .then(r => r.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error);
        render(res.data);
      })
      .catch(showError)
      .finally(() => document.getElementById('loading').style.display = 'none');
  }

  function render(data) {
    const container = document.getElementById('results');
    if (!data.accounts.length) {
      container.innerHTML = '<div class="empty">No entries for this selection.</div>';
      return;
    }

    container.innerHTML = data.accounts.map(acc => {
      const rows = acc.entries.map(e =>
        '<tr><td>' + e.date + '</td><td>' + e.jrnlNo + '</td><td>' + escapeHtml(e.particulars) +
        (e.details ? ' — ' + escapeHtml(e.details) : '') + '</td>' +
        '<td>' + (e.debit ? fmt(e.debit) : '') + '</td>' +
        '<td>' + (e.credit ? fmt(e.credit) : '') + '</td>' +
        '<td>' + fmt(e.balance) + '</td></tr>'
      ).join('');

      return '<div class="account-block">' +
        '<div class="account-header"><span>' + escapeHtml(acc.fullacname) + '</span>' +
        '<span>Closing: ' + fmt(acc.closingBalance) + '</span></div>' +
        '<table><thead><tr><th>Date</th><th>Jrnl No</th><th>Particulars</th>' +
        '<th>Debit</th><th>Credit</th><th>Balance</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showError(err) {
    document.getElementById('error').innerText = err.message || err;
  }

  init();
</script>
</body>
</html>
